<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="codepilot: a local, IDE-style AI coding assistant">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0d14"/><stop offset="1" stop-color="#151a2e"/></linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.5" r="0.6"><stop offset="0" stop-color="#5b8cff" stop-opacity="0.35"/><stop offset="1" stop-color="#5b8cff" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow2" cx="0.85" cy="0.2" r="0.5"><stop offset="0" stop-color="#a855f7" stop-opacity="0.22"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/></radialGradient>
    <linearGradient id="title" x1="0" x2="1"><stop offset="0" stop-color="#5b8cff"/><stop offset="0.5" stop-color="#8b7bff"/><stop offset="1" stop-color="#c06bff"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#e8ebf2" stroke-opacity="0.05"/></pattern>
    <style>
      .pulse { animation: pulse 3.2s ease-in-out infinite; transform-origin: 150px 150px; }
      @keyframes pulse { 0%,100% { opacity: .55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.06); } }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .chip { animation: rise .9s ease-out both; }
      .c2 { animation-delay: .15s; } .c3 { animation-delay: .3s; } .c4 { animation-delay: .45s; }
      @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace; }
    </style>
  </defs>
  <rect width="1200" height="300" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="20" fill="url(#grid)"/>
  <rect width="1200" height="300" rx="20" fill="url(#glow)"/>
  <rect width="1200" height="300" rx="20" fill="url(#glow2)"/>
  <g class="pulse"><circle cx="150" cy="150" r="78" fill="#5b8cff" opacity="0.12"/></g>
  <g transform="translate(96 96) scale(4.5)" fill="none" stroke="url(#title)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2 3 7v10l9 5 9-5V7z"/><path d="m9.5 10-2 2 2 2"/><path d="m14.5 10 2 2-2 2"/>
  </g>
  <text x="270" y="138" font-size="72" font-weight="800" fill="url(#title)" letter-spacing="-1.5">codepilot</text>
  <text x="272" y="182" font-size="24" fill="#e8ebf2" font-weight="500">Your local, IDE-style AI pair programmer.</text>
  <text x="272" y="214" font-size="18" fill="#9aa3b5">Review · debug · fix · build, on any folder. You approve every change.</text>
  <g class="mono" font-size="14" fill="#e8ebf2">
    <g class="chip"><rect x="272" y="236" width="98" height="30" rx="15" fill="#1c2233" stroke="#2c3550"/><text x="321" y="256" text-anchor="middle" class="mono">Bedrock</text></g>
    <g class="chip c2"><rect x="380" y="236" width="110" height="30" rx="15" fill="#1c2233" stroke="#2c3550"/><text x="435" y="256" text-anchor="middle" class="mono">Anthropic</text></g>
    <g class="chip c3"><rect x="500" y="236" width="88" height="30" rx="15" fill="#1c2233" stroke="#2c3550"/><text x="544" y="256" text-anchor="middle" class="mono">OpenAI</text></g>
    <g class="chip c4"><rect x="598" y="236" width="88" height="30" rx="15" fill="#1c2233" stroke="#2c3550"/><text x="642" y="256" text-anchor="middle" class="mono">Ollama</text></g>
  </g>
  <g transform="translate(830 70)">
    <rect width="320" height="160" rx="12" fill="#1c2233" stroke="#2c3550"/>
    <circle cx="20" cy="18" r="5" fill="#ff5f57"/><circle cx="36" cy="18" r="5" fill="#febc2e"/><circle cx="52" cy="18" r="5" fill="#28c840"/>
    <g class="mono" font-size="13">
      <text x="18" y="56" fill="#9aa3b5">$ pytest -q</text>
      <text x="18" y="80" fill="#f2706c">- if p["price"] &gt; max_price</text>
      <text x="18" y="102" fill="#4cc38a">+ if p["price"] &lt;= max_price</text>
      <text x="18" y="128" fill="#4cc38a">✓ 2 passed</text>
      <text x="18" y="150" fill="#e8ebf2">&gt; Apply<tspan class="cursor" fill="#5b8cff"> ▍</tspan></text>
    </g>
  </g>
</svg>
