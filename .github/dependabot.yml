# Deliberately quiet: one grouped PR per ecosystem at most, once a month, no major-version jumps.
# (An unconfigured Dependabot opened seven PRs at once.) Majors are bumped by a person, with a test run.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    target-branch: develop
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    groups:
      python-dependencies:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
